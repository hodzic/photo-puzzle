<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Puzzle</title>
<meta name="description" content="A sliding-tile puzzle in any size from 2×2 to 8×8, with numbers or your own photo. Share a scrambled photo as a link.">
<meta name="theme-color" content="#23272e">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <header>
    <h1>Photo Puzzle</h1>
    <div class="stats">
      <div class="stat"><b id="moves">0</b><span>Moves</span></div>
      <div class="stat"><b id="time">0:00</b><span>Time</span></div>
    </div>
  </header>

  <div class="settings">
    <label class="field">Columns
      <select id="cols"></select>
    </label>
    <span class="times" aria-hidden="true">×</span>
    <label class="field">Rows
      <select id="rows"></select>
    </label>
    <label class="btn ghost" id="photoLabel" tabindex="0">
      <span id="photoText">Use a photo</span>
      <input type="file" id="photo" accept="image/*" hidden>
    </label>
    <button class="btn ghost" id="clearPhoto" hidden>Remove photo</button>
    <label class="check" id="numbersWrap" hidden><input type="checkbox" id="numbers"> Show numbers</label>
  </div>

  <div class="frame" id="frame">
    <div class="board" id="board" role="grid" aria-label="Puzzle board">
      <img class="peek" id="peek" alt="" hidden>
    </div>
  </div>

  <p class="msg" id="msg" aria-live="polite"></p>

  <div class="controls">
    <button class="btn" id="shuffle">Shuffle</button>
    <button class="btn ghost" id="peekBtn" hidden>Hold to peek</button>
    <button class="btn ghost" id="share">Share puzzle</button>
  </div>

  <div class="linkbox" id="linkbox" hidden>
    <label for="link">Copy this link and send it:</label>
    <input id="link" readonly>
  </div>

  <p class="hint">Tap a tile in the gap's row or column to slide it, along with any tiles between. Arrow keys work too.
    A shared puzzle travels inside the link itself, photo included, so nothing is uploaded anywhere.</p>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
